services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shelf_db
      POSTGRES_USER: shelf_user
      POSTGRES_PASSWORD: shelf_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: shelf_db
      POSTGRES_USER: shelf_user
      POSTGRES_PASSWORD: shelf_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: 1
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
